# Local infrastructure for Auctra: MySQL 8 + Redis 7.
# The Node backend and Vite frontend run on the host (npm run dev) for a fast dev loop.
# Host ports are 3307/6380 so they do not clash with a MySQL/Redis you may already run locally.
services:
  mysql:
    image: mysql:8.4
    container_name: auctra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: auctra_root_dev
      MYSQL_DATABASE: auctra
      MYSQL_USER: auctra
      MYSQL_PASSWORD: auctra_dev_password
      TZ: UTC
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-lock-wait-timeout=10
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -pauctra_root_dev --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: auctra-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'no', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
